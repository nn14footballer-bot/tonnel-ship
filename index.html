<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tonnel Ship Ultimate 🛒</title>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBIIMlC4FbZOcyttAnGwOK1zgt4Ki34qLY",
  authDomain: "tonnel-ship.firebaseapp.com",
  projectId: "tonnel-ship",
  storageBucket: "tonnel-ship.appspot.com",
  messagingSenderId: "466238209699",
  appId: "1:466238209699:web:835fa8e7f7328478530916",
  measurementId: "G-T7ML41LMBE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rdb = getDatabase(app);

// ======= GLOBAL VARIABLES =======
let products=[], cart=JSON.parse(localStorage.getItem("cart")||"[]");
let currentUser=null;

// ======= CUSTOMER SIGNUP/LOGIN =======
async function customerSignup(email,password){
  try{
    const userCredential = await createUserWithEmailAndPassword(auth,email,password);
    const user=userCredential.user;
    const usersCol=collection(db,"users");
    const snapshot=await getDocs(usersCol);
    let isAdmin = snapshot.empty; // first user = admin
    await addDoc(usersCol,{uid:user.uid,email,role:isAdmin?"admin":"customer"});
    alert("Signup successful! You are "+(isAdmin?"Admin":"Customer"));
    if(isAdmin) showAdminPanel();
  }catch(e){alert("Failed: "+e.message);}
}

async function customerLogin(email,password){
  try{
    const userCredential = await signInWithEmailAndPassword(auth,email,password);
    currentUser = userCredential.user;
    const usersCol=collection(db,"users");
    const snapshot = await getDocs(usersCol);
    let role="customer";
    snapshot.forEach(doc=>{if(doc.data().uid===currentUser.uid) role=doc.data().role;});
    alert("Login successful as "+role);
    if(role==="admin") showAdminPanel();
  }catch(e){alert("Login failed: "+e.message);}
}

onAuthStateChanged(auth,user=>{if(user) currentUser=user;});

// ======= CART FUNCTIONS =======
function saveCart(){localStorage.setItem("cart",JSON.stringify(cart)); updateCart();}
function addToCart(pid){let p=products.find(p=>p.id===pid); if(!p.stock){alert("Out of stock"); return;} let item=cart.find(c=>c.id===pid); if(item)item.qty++; else cart.push({...p,qty:1}); saveCart();}
function removeFromCart(pid){cart=cart.filter(c=>c.id!==pid); saveCart();}
function changeQty(pid,delta){let item=cart.find(c=>c.id===pid);if(item){item.qty+=delta; if(item.qty<1) cart=cart.filter(c=>c.id!==pid); saveCart();}}
function updateCart(){let html=""; let total=0; cart.forEach(c=>{total+=c.price*c.qty; html+=`<div>${c.name} x ${c.qty} <button onclick="changeQty(${c.id},-1)">-</button><button onclick="changeQty(${c.id},1)">+</button> <button onclick="removeFromCart(${c.id})">Remove</button></div>`;}); document.getElementById("cartItems").innerHTML=html; document.getElementById("total").innerText="₦"+total;}
window.onload=updateCart;

// ======= AI SMART PRICING =======
function aiPrice(product){
  let demandFactor = Math.min(1 + product.sales/50, 1.5);
  let suggested = product.basePrice * demandFactor;
  if(suggested < product.minPrice) suggested = product.minPrice;
  if(suggested > product.maxPrice) suggested = product.maxPrice;
  return Math.round(suggested);
}

// ======= SEARCH =======
function searchProducts(){let q=document.getElementById("searchInput").value.toLowerCase(); renderProducts(products.filter(p=>p.name.toLowerCase().includes(q)));}

// ======= RENDER PRODUCTS =======
function renderProducts(list){
  let html=""; list.forEach(p=>{
    html+=`<div class="card"><img src="${p.images[0]}" onclick="showProduct(${p.id})"><h4>${p.name}</h4><div class="price-old">₦${p.oldPrice}</div><div class="price-new">₦${p.price}</div>`;
    if(!p.stock) html+='<div class="out">Out of Stock</div>';
    html+=`<button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button></div>`;
  });
  document.getElementById("productList").innerHTML=html;
}

// ======= SHOW PRODUCT =======
function showProduct(pid){
  let p=products.find(p=>p.id===pid);
  let html=`<h3>${p.name}</h3>`;
  p.images.forEach(img=>html+=`<img class="carousel-img" src="${img}">`);
  html+=`<div class="price-old">₦${p.oldPrice}</div><div class="price-new">₦${p.price}</div>`;
  if(!p.stock) html+='<div class="out">Out of Stock</div>';
  html+=`<p>Vendor: ${p.vendor}</p><button onclick="addToCart(${p.id})" class="add-btn">Add to Cart</button>`;
  document.getElementById("productPage").innerHTML=html;
  document.getElementById("productPage").style.display="block";
  document.getElementById("productList").style.display="none";
}

// ======= ADMIN PANEL =======
function showAdminPanel(){document.getElementById("adminPanel").style.display="block"; document.getElementById("customerLogin").style.display="none";}
async function uploadProduct(){
  const files=document.getElementById('imageFile').files;
  if(files.length===0){alert("Select at least one image"); return;}
  let imagesBase64=[];
  let readCount=0;
  for(let i=0;i<files.length;i++){
    const reader=new FileReader();
    reader.onload=function(e){
      imagesBase64.push(e.target.result);
      readCount++;
      if(readCount===files.length){
        const newProd={id:Date.now(),name:document.getElementById('name').value,oldPrice:parseFloat(document.getElementById('oldPrice').value),price:parseFloat(document.getElementById('price').value),stock:true,images:imagesBase64,vendor:"Admin",basePrice:parseFloat(document.getElementById('price').value),minPrice:parseFloat(document.getElementById('minPrice').value||0),maxPrice:parseFloat(document.getElementById('maxPrice').value||1000000),sales:0};
        products.push(newProd); renderProducts(products); alert("Product added with images!"); 
      }
    }
    reader.readAsDataURL(files[i]);
  }
}

// ======= CHAT & NOTIFICATIONS =======
function sendMessage(msg){push(ref(rdb,"messages"),{from:currentUser.email,msg:msg,time:Date.now()});}
function listenMessages(){onChildAdded(ref(rdb,"messages"),snapshot=>{let data=snapshot.val();alert("New message from "+data.from+": "+data.msg);});}
</script>

<style>

header{background:linear-gradient(90deg,brown,darkgreen,darkred,gold);color:white;text-align:center;padding:15px;font-size:24px;}

</head>
