<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Niro Coin Loading</title>

  <link rel="stylesheet" href="index.css">
</head>

<body>

  <div class="overlay"></div>

  <div class="container">

    <!-- LOGO IMAGE -->
    <div class="logo-box">
      <img src="logo.png" alt="Niro Coin Logo" class="logo" />
    </div>

    <h1>Niro Coin</h1>

    <p>The Future of Telegram Rewards</p>

    <!-- LOADING BAR -->
    <div class="loading-bar">
      <div class="progress"></div>
    </div>

    <div class="loading-text">
      Initializing system<span class="dots"></span>
    </div>

    <div class="footer">
      Secure • Fast • Rewarding
    </div>

  </div>

  <script>
    // Redirect after 10 seconds
    setTimeout(() => {
      window.location.href = "home.html";
    }, 10000);
  </script>

</body>
</html>
